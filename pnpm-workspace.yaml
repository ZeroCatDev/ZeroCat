packages:
  - 'apps/*'
  - 'packages/*'

# Keep pinned transitive dependencies on patched versions.
overrides:
  'monaco-editor>dompurify': '^3.4.17'
  '@rollup/plugin-terser>serialize-javascript': '^7.1.3'
  'micromark-extension-math>katex': '^0.19.0'
  # Satisfy the tracing SDK's <1.10 peer requirement.
  '@opentelemetry/api': '1.9.1'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@sentry/cli'
  - bcrypt
  - esbuild
  - prisma
  - re2
  - sharp
